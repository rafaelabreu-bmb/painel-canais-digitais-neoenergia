:root{
  color-scheme:light;
  --bg:#F7F7FE; --card:#FFFFFF; --line:#E9E4ED; --grid:#EEEBF3;
  --ink:#03021E; --ink-2:#3D4C6F; --ink-3:#6B7591; --muted:#C6C5C9;
  --brand:#400FF2; --brand-2:#04017B; --lilas:#9884FF; --lilas-c:#D9CDFD;
  --up:#0B7A4B; --down:#B42318;
  --s1:#400FF2; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#9884FF;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"GSF","Google Sans","Segoe UI",system-ui,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
body{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:24px 24px 48px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding:8px 0 20px}
.logo{height:22px;display:block;margin-bottom:18px}
h1{font-weight:300;font-size:36px;letter-spacing:-.02em;margin:0;line-height:1.1}
h1 b{font-weight:400;color:var(--brand)}
.sub{color:var(--ink-2);font-size:15px;margin-top:6px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
.tag b{font-weight:500;color:var(--ink)}

/* filtros */
.filters{position:sticky;top:0;z-index:5;background:rgba(247,247,254,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:12px 0;margin-bottom:8px;border-bottom:1px solid var(--line)}
.frow{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.fgroup{display:flex;flex-direction:column;gap:6px}
.flabel{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 30px 8px 12px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
select:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.range{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink-2);padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px 6px 10px;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chip[aria-pressed="false"]{color:var(--ink-3);background:transparent}
.chip[aria-pressed="false"] i{background:transparent!important;border:1.5px solid var(--muted)}
.notice{margin:12px 0 0;font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.notice[hidden]{display:none}
.dot{width:6px;height:6px;border-radius:50%;background:var(--lilas);flex:none}

/* cards */
section{margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px}
h2{font-weight:400;font-size:19px;letter-spacing:-.01em;margin:0}
.cdesc{font-size:13px;color:var(--ink-3);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.kpi .l{font-size:12px;color:var(--ink-2)}
.kpi .v{font-weight:300;font-size:26px;letter-spacing:-.02em;margin:8px 0 6px;white-space:nowrap}

/* ---------- formatação ---------- */
function nf(v,d){ return v.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function brl(v){
  var a=Math.abs(v);
  if(a>=1e6) return "R$ "+nf(v/1e6, a>=1e7?1:2)+" mi";
  if(a>=1e3) return "R$ "+nf(v/1e3, a>=1e5?0:1)+" mil";
  return "R$ "+nf(v,0);
}
function qtd(v){
  var a=Math.abs(v);
  if(a>=1e6) return nf(v/1e6,2)+" mi";
  if(a>=1e4) return nf(v/1e3,1)+" mil";
  if(a>=10) return nf(v,0);
  return nf(v,1);
}
function fmt(k,v){
  if(v==null||!isFinite(v)) return "—";
  if(k==="tpv") return brl(v);
  if(k==="ticket") return "R$ "+nf(v,0);
  if(k==="fpt") return nf(v,2);
  if(k==="parc") return nf(v*100,1)+"%";

function agg(i0,i1,canais){
  var o={tpv:0,tx:0,fat:0,parc:0,dias:0};
  if(i0<0) return null;
  for(var i=i0;i<=i1;i++) o.dias+=P[i].dias;
  var n=0;
  R.forEach(function(r){
    var i=pidx[r.periodo];
    if(i>=i0&&i<=i1&&canais.indexOf(r.canal)>=0){ o.tpv+=r.tpv; o.tx+=r.tx; o.fat+=r.faturas; o.parc+=r.parc; n++; }
  });

}

  R.forEach(function(r){
    var i=pidx[r.periodo];

  });

}

  if(k==="tx") return o.tx/div;
  if(k==="fat") return o.fat/div;
  if(k==="ticket") return o.tx? o.tpv/o.tx : null;
  if(k==="fpt") return o.tx? o.fat/o.tx : null;
  if(k==="parc") return o.tx? o.parc/o.tx : null;

}
function chartStart(){ var cr=cmpRange(); return cr? Math.min(cr[0],st.de) : st.de; }
function lbl(i0,i1){ return i0===i1? P[i0].rotulo : P[i0].rotulo+" a "+P[i1].rotulo; }
function deltaHtml(cur,prev,cmpLbl,k){
  if(cur==null||prev==null||!prev) return '<span class="delta flat">sem base de comparação</span>';
  if(k==="parc"){ var pp=(cur-prev)*100, c2=Math.abs(pp)<0.05?"flat":(pp>0?"up":"down"); return '<span class="delta '+c2+'">'+(c2==="up"?"▲":c2==="down"?"▼":"•")+" "+(pp>0?"+":"")+nf(pp,1)+' p.p. <span class="vs">vs '+cmpLbl+'</span></span>'; }
  var d=cur/prev-1, cls=Math.abs(d)<0.005?"flat":(d>0?"up":"down"), ar=cls==="up"?"▲":(cls==="down"?"▼":"•");
  return '<span class="delta '+cls+'">'+ar+" "+pct(d)+' <span class="vs">vs '+cmpLbl+'</span></span>';
}
function dCell(cur,prev,k){
  if(cur==null||prev==null||!prev) return '<span class="d delta flat">—</span>';
  if(k==="parc"){ var pp=(cur-prev)*100, c2=Math.abs(pp)<0.05?"flat":(pp>0?"up":"down"); return '<span class="d delta '+c2+'">'+(pp>0?"+":"")+nf(pp,1)+' p.p.</span>'; }
  var d=cur/prev-1, cls=Math.abs(d)<0.005?"flat":(d>0?"up":"down");
  return '<span class="d delta '+cls+'">'+pct(d)+'</span>';
}

/* ---------- filtros ---------- */
function initFilters(){
  var de=document.getElementById("fDe"), ate=document.getElementById("fAte");
  P.forEach(function(p,i){
    var t=p.rotulo+(p.parcial?" (parcial)":"");
    de.appendChild(el("option",{value:i},t)); ate.appendChild(el("option",{value:i},t));
  });
  de.value=st.de; ate.value=st.ate;
  de.onchange=function(){ st.de=+de.value; if(st.de>st.ate){ st.ate=st.de; ate.value=st.ate; } render(); };
  ate.onchange=function(){ st.ate=+ate.value; if(st.ate<st.de){ st.de=st.ate; de.value=st.de; } render(); };
  document.getElementById("fCmp").onchange=function(e){ st.cmp=e.target.value; render(); };
  document.querySelectorAll("#fVisao button").forEach(function(b){
    b.onclick=function(){ st.visao=b.dataset.v; document.querySelectorAll("#fVisao button").forEach(function(x){ x.setAttribute("aria-pressed", x===b); }); render(); };
  });
  var ds=document.getElementById("fDist");
  ds.appendChild(el("option",{value:"todas"},"Todas"));
  (D.distribuidoras||[]).forEach(function(d){ var o=el("option",{value:d.id},d.nome+(d.disponivel?"":" (em breve)")); if(!d.disponivel) o.disabled=true; ds.appendChild(o); });
  var ch=document.getElementById("fCanais");
  C.forEach(function(c){
    var b=el("button",{"class":"chip","aria-pressed":"true",type:"button"},'<i style="background:'+COR[c.id]+'"></i>'+c.nome+(c.tag?' <span class="badge">'+c.tag+'</span>':""));
    b.onclick=function(){
      var on=!st.canais[c.id];
      if(!on && ativos().length===1) return;
      st.canais[c.id]=on; b.setAttribute("aria-pressed",on); render();
    };
    ch.appendChild(b);
  });
  document.getElementById("fMetrica").onchange=function(e){ st.metrica=e.target.value; renderEvo(); };
}

/* ---------- KPIs ---------- */
function renderKpis(){
  var cs=ativos(), cur=agg(st.de,st.ate,cs), cr=cmpRange(), prev=cr?agg(cr[0],cr[1],cs):null;
  var cmpLbl=cr?lbl(cr[0],cr[1]):"";
  var dia=st.visao==="dia";
  var defs=[
    {k:"tpv",l:"TPV",s:function(){ return dia? "Total no período: "+brl(cur.tpv) : "Média diária: "+brl(cur.tpv/cur.dias); }},
    {k:"tx",l:"Transações",s:function(){ return dia? "Total no período: "+qtd(cur.tx) : "Média diária: "+qtd(cur.tx/cur.dias); }},
    {k:"ticket",l:"Ticket médio",s:function(){ return "Valor médio por pagamento"; }},
    {k:"fat",l:"Faturas quitadas",s:function(){ return dia? "Total no período: "+qtd(cur.fat) : "Média diária: "+qtd(cur.fat/cur.dias); }},
    {k:"fpt",l:"Faturas por transação",s:function(){ return "Faturas pagas em cada pagamento"; }},
    {k:"parc",l:"Pagamentos parcelados",s:function(){ return "% das transações · "+qtd(cur.parc)+" no período"; }}
  ];
  var box=document.getElementById("kpis"); box.innerHTML="";
  defs.forEach(function(d){
    var v=val(cur,d.k,st.visao), pv=val(prev,d.k,st.visao);
    var suf = (dia && (d.k==="tpv"||d.k==="tx"||d.k==="fat")) ? " <small>/dia</small>" : "";
    box.appendChild(el("div",{"class":"kpi"},
      '<div class="l">'+d.l+'</div><div class="v">'+(d.k==="fat"?qtd(v):fmt(d.k,v))+suf+'</div>'+
      (st.cmp==="none"?"":deltaHtml(v,pv,cmpLbl,d.k))+'<div class="s">'+(cur?d.s():"")+'</div>'));
  });
}

/* ---------- tooltip ---------- */
var tip=document.getElementById("tip");
function showTip(html,x,y,host){
  tip.innerHTML=html; tip.style.opacity=1;
  var r=host.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight;
  var left=r.left+window.scrollX+x+14, top=r.top+window.scrollY+y-th/2;
  if(left+tw>window.scrollX+document.documentElement.clientWidth-8) left=r.left+window.scrollX+x-tw-14;
  tip.style.left=left+"px"; tip.style.top=Math.max(window.scrollY+8,top)+"px";
}
function hideTip(){ tip.style.opacity=0; }
var SVGNS="http://www.w3.org/2000/svg";
function s(t,a){ var e=document.createElementNS(SVGNS,t); for(var k in a) e.setAttribute(k,a[k]); return e; }
function niceMax(v){ if(v<=0) return 1; var p=Math.pow(10,Math.floor(Math.log10(v))), n=v/p; var m=n<=1?1:n<=1.5?1.5:n<=2?2:n<=2.5?2.5:n<=3?3:n<=4?4:n<=5?5:n<=6?6:n<=8?8:10; return m*p; }

/* ---------- evolução ---------- */
function renderEvo(){
  var host=document.getElementById("cEvo"); host.innerHTML="";
  var k=st.metrica, cs=ativos(), idx=[], i0=chartStart();
  for(var i=i0;i<=st.ate;i++) idx.push(i);
  var dia=st.visao==="dia" && (k==="tpv"||k==="tx");
  document.getElementById("evoDesc").textContent =
    ({tpv:"TPV",tx:"Transações",ticket:"Ticket médio",fpt:"Faturas por transação",parc:"Pagamentos parcelados (% das transações)"})[k] +
    (dia?" · média diária":(k==="tpv"||k==="tx"?" · total do mês":"")) + " · "+lbl(i0,st.ate);
  var series=cs.map(function(c){
    return {c:c, pts:idx.map(function(i){ var o=aggCanal(i,i,c); return {i:i,v:val(o,k,dia?"dia":"total")}; })};
  });
  var max=0; series.forEach(function(se){ se.pts.forEach(function(p){ if(p.v!=null&&p.v>max) max=p.v; }); });
  var W=Math.max(320,host.clientWidth), H=300, m={t:14,r:150,b:28,l:64};
  if(W<560) m.r=16;
  var iw=W-m.l-m.r, ih=H-m.t-m.b, ym=niceMax(max*1.05);
  var x=function(j){ return idx.length===1? m.l+iw/2 : m.l+iw*j/(idx.length-1); };
  var y=function(v){ return m.t+ih-(v/ym)*ih; };
  var svg=s("svg",{viewBox:"0 0 "+W+" "+H,height:H,role:"img","aria-label":"Evolução por canal"});
  var ax=s("g",{"class":"axis"});
  for(var t=0;t<=4;t++){
    var yv=ym*t/4, yy=y(yv);
    ax.appendChild(s("line",{x1:m.l,x2:m.l+iw,y1:yy,y2:yy,stroke:t?"var(--grid)":"var(--line)","stroke-width":1}));
    var tx=s("text",{x:m.l-10,y:yy+4,"text-anchor":"end"}); tx.textContent=fmt(k,yv).replace("R$ ",""); ax.appendChild(tx);
  }
  idx.forEach(function(i,j){ var tt=s("text",{x:x(j),y:H-8,"text-anchor":"middle"}); tt.textContent=P[i].rotulo+(P[i].parcial?"*":""); ax.appendChild(tt); });
  svg.appendChild(ax);
  var labels=[];
  series.forEach(function(se){
    var d="", started=false, last=null;
    se.pts.forEach(function(p,j){ if(p.v==null){ started=false; return; } d+=(started?"L":"M")+x(j)+","+y(p.v); started=true; last={x:x(j),y:y(p.v),v:p.v}; });
    if(d) svg.appendChild(s("path",{d:d,fill:"none",stroke:COR[se.c],"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
    se.pts.forEach(function(p,j){ if(p.v!=null) svg.appendChild(s("circle",{cx:x(j),cy:y(p.v),r:4,fill:COR[se.c],stroke:"#fff","stroke-width":2})); });
    if(last && m.r>100) labels.push({y:last.y,x:last.x,c:se.c,v:last.v});
  });
  labels.sort(function(a,b){ return a.y-b.y; });
  for(var q=1;q<labels.length;q++) if(labels[q].y-labels[q-1].y<15) labels[q].y=labels[q-1].y+15;
  var lim=m.t+ih-2; for(var q2=labels.length-1;q2>=0;q2--){ if(labels[q2].y>lim) labels[q2].y=lim; lim=labels[q2].y-15; }
  labels.forEach(function(L){
    var g=s("text",{x:m.l+iw+12,y:L.y+4,"font-size":"12",fill:"var(--ink-2)"});
    g.textContent=NOME[L.c].split(" (")[0]; svg.appendChild(g);
  });
  var cross=s("line",{y1:m.t,y2:m.t+ih,stroke:"var(--ink-3)","stroke-width":1,"stroke-dasharray":"3 3",opacity:0});
  svg.appendChild(cross);
  var hit=s("rect",{x:m.l-20,y:m.t,width:iw+40,height:ih,fill:"transparent"});
  hit.addEventListener("mousemove",function(ev){
    var r=svg.getBoundingClientRect(), px=(ev.clientX-r.left)*(W/r.width);
    var j=idx.length===1?0:Math.round((px-m.l)/iw*(idx.length-1)); j=Math.max(0,Math.min(idx.length-1,j));
    cross.setAttribute("x1",x(j)); cross.setAttribute("x2",x(j)); cross.setAttribute("opacity",1);
    var rows=series.map(function(se){ return {c:se.c,v:se.pts[j].v}; }).filter(function(r){return r.v!=null;}).sort(function(a,b){return b.v-a.v;});
    var h='<div class="t">'+P[idx[j]].rotulo+(P[idx[j]].parcial?" · parcial":"")+'</div>'+
      (rows.length?rows.map(function(r){ return '<div class="row"><span><i style="background:'+COR[r.c]+'"></i>'+NOME[r.c]+'</span><span>'+fmt(k,r.v)+'</span></div>'; }).join(""):"Sem operação no mês");
    showTip(h,(x(j))*(r.width/W),(ev.clientY-r.top),host);
  });
  hit.addEventListener("mouseleave",function(){ cross.setAttribute("opacity",0); hideTip(); });
  svg.appendChild(hit);
  host.appendChild(svg);
  legend("lEvo",cs);
}
function legend(id,cs){
  document.getElementById(id).innerHTML=cs.map(function(c){ return '<span><i style="background:'+COR[c]+'"></i>'+NOME[c]+'</span>'; }).join("");
}

/* ---------- participação ---------- */
function renderMix(){
  var host=document.getElementById("cMix"); host.innerHTML="";
  var cs=ativos(), idx=[]; for(var i=chartStart();i<=st.ate;i++) idx.push(i);
  var W=Math.max(300,host.clientWidth), H=300, m={t:14,r:8,b:28,l:40};
  var iw=W-m.l-m.r, ih=H-m.t-m.b;
  var bw=Math.min(72, iw/idx.length*0.55), step=iw/idx.length;
  var svg=s("svg",{viewBox:"0 0 "+W+" "+H,height:H,role:"img","aria-label":"Participação no TPV"});
  var ax=s("g",{"class":"axis"});
  [0,.25,.5,.75,1].forEach(function(t){ var yy=m.t+ih-t*ih; ax.appendChild(s("line",{x1:m.l,x2:m.l+iw,y1:yy,y2:yy,stroke:t?"var(--grid)":"var(--line)"})); var tx=s("text",{x:m.l-8,y:yy+4,"text-anchor":"end"}); tx.textContent=(t*100)+"%"; ax.appendChild(tx); });
  svg.appendChild(ax);
  idx.forEach(function(i,j){
    var tot=0, parts=cs.map(function(c){ var o=aggCanal(i,i,c); var v=o?o.tpv:0; tot+=v; return {c:c,v:v}; });
    var cx=m.l+step*j+step/2, yb=m.t+ih;
    var tl=s("text",{x:cx,y:H-8,"text-anchor":"middle","class":"axis"}); tl.setAttribute("font-size","11"); tl.setAttribute("fill","var(--ink-3)"); tl.textContent=P[i].rotulo+(P[i].parcial?"*":""); svg.appendChild(tl);
    if(!tot) return;
    parts.forEach(function(p){
      if(!p.v) return;
      var h=p.v/tot*ih, y0=yb-h;
      var r=s("rect",{x:cx-bw/2,y:y0+1,width:bw,height:Math.max(0,h-2),rx:3,fill:COR[p.c]});
      r.addEventListener("mousemove",function(ev){ var b=host.getBoundingClientRect(); showTip('<div class="t">'+P[i].rotulo+'</div><div class="row"><span><i style="background:'+COR[p.c]+'"></i>'+NOME[p.c]+'</span><span>'+nf(p.v/tot*100,1)+'%</span></div><div class="row"><span>TPV</span><span>'+brl(p.v)+'</span></div>',ev.clientX-b.left,ev.clientY-b.top,host); });
      r.addEventListener("mouseleave",hideTip);
      svg.appendChild(r);
      if(h>=20){ var t=s("text",{x:cx,y:y0+h/2+4,"text-anchor":"middle","font-size":"11",fill:"#fff","pointer-events":"none"}); t.textContent=nf(p.v/tot*100,0)+"%"; svg.appendChild(t); }
      yb=y0;
    });
  });
  host.appendChild(svg);
  legend("lMix",cs);
}

/* ---------- tabela ---------- */
function renderTab(){
  var cs=ativos(), cr=cmpRange(), dia=st.visao==="dia";
  document.getElementById("tabDesc").textContent=lbl(st.de,st.ate)+(dia?" · TPV e transações em média diária":" · TPV e transações no total do período")+(cr?" · variação vs "+lbl(cr[0],cr[1]):"");
  var totCur=agg(st.de,st.ate,cs);
  var rows=cs.map(function(c){
    var o=aggCanal(st.de,st.ate,c), p=cr?aggCanal(cr[0],cr[1],c):null, v=dia?"dia":"total";
    return {c:c,o:o,p:p,tpv:val(o,"tpv",v),tx:val(o,"tx",v),ticket:val(o,"ticket"),fpt:val(o,"fpt"),parc:val(o,"parc"),pparc:val(p,"parc"),
      ptpv:val(p,"tpv",v),ptx:val(p,"tx",v),pticket:val(p,"ticket"),pfpt:val(p,"fpt"),
      share:o&&totCur?o.tpv/totCur.tpv:null};
  });
  var sk=st.sort.k, dir=st.sort.dir;
  rows.sort(function(a,b){ if(sk==="canal") return dir*NOME[a.c].localeCompare(NOME[b.c]); var x=a[sk], y=b[sk]; if(x==null) return 1; if(y==null) return -1; return dir*(x-y); });
  var cols=[["canal","Canal"],["tpv","TPV"],["tx","Transações"],["ticket","Ticket médio"],["fpt","Faturas / transação"],["parc","Parcelados"],["share","Participação no TPV"]];
  var h="<thead><tr>"+cols.map(function(c){ var on=sk===c[0]; return '<th data-k="'+c[0]+'"'+(on?' aria-sort="'+(dir<0?"descending":"ascending")+'"':"")+'>'+c[1]+'<span class="ar">'+(on&&dir>0?"↑":"↓")+'</span></th>'; }).join("")+"</tr></thead><tbody>";
  var showD=!!cr;
  rows.forEach(function(r){
    var c=C.filter(function(x){return x.id===r.c;})[0];
    h+='<tr><td class="canal"><i style="background:'+COR[r.c]+'"></i>'+NOME[r.c]+(c.tag?' <span class="badge">'+c.tag+'</span>':"")+'</td>';
    if(!r.o){ h+='<td colspan="6" style="text-align:left;color:var(--ink-3)">Sem operação no período</td></tr>'; return; }
    h+='<td>'+fmt("tpv",r.tpv)+(showD?dCell(r.tpv,r.ptpv):"")+'</td>'+
       '<td>'+fmt("tx",r.tx)+(showD?dCell(r.tx,r.ptx):"")+'</td>'+
       '<td>'+fmt("ticket",r.ticket)+(showD?dCell(r.ticket,r.pticket):"")+'</td>'+
       '<td>'+fmt("fpt",r.fpt)+(showD?dCell(r.fpt,r.pfpt):"")+'</td>'+
       '<td>'+fmt("parc",r.parc)+(showD?dCell(r.parc,r.pparc,"parc"):"")+'</td>'+
       '<td><span class="bar" style="width:'+Math.round((r.share||0)*80)+'px"></span>'+nf((r.share||0)*100,1)+'%</td></tr>';
  });
  if(totCur){
    var v=dia?"dia":"total", pt=cr?agg(cr[0],cr[1],cs):null;
    h+='<tr class="total"><td>Total digital</td><td>'+fmt("tpv",val(totCur,"tpv",v))+(showD?dCell(val(totCur,"tpv",v),val(pt,"tpv",v)):"")+'</td><td>'+fmt("tx",val(totCur,"tx",v))+(showD?dCell(val(totCur,"tx",v),val(pt,"tx",v)):"")+'</td><td>'+fmt("ticket",val(totCur,"ticket"))+(showD?dCell(val(totCur,"ticket"),val(pt,"ticket")):"")+'</td><td>'+fmt("fpt",val(totCur,"fpt"))+(showD?dCell(val(totCur,"fpt"),val(pt,"fpt")):"")+'</td><td>'+fmt("parc",val(totCur,"parc"))+(showD?dCell(val(totCur,"parc"),val(pt,"parc"),"parc"):"")+'</td><td>100%</td></tr>';
  }
  var tab=document.getElementById("tab"); tab.innerHTML=h+"</tbody>";
  tab.querySelectorAll("th").forEach(function(th){ th.onclick=function(){ var k=th.dataset.k; if(st.sort.k===k) st.sort.dir*=-1; else st.sort={k:k,dir:k==="canal"?1:-1}; renderTab(); }; });
}

/* ---------- aviso de período parcial ---------- */
function renderNotice(){
  var parc=[]; for(var i=st.de;i<=st.ate;i++) if(P[i].parcial) parc.push(P[i]);
  var cr=cmpRange(), msgs=[];
  parc.forEach(function(p){ msgs.push(p.rotulo+" é parcial ("+p.nota+")."); });
  if(parc.length && st.visao==="total" && cr) msgs.push("Para comparar períodos de tamanhos diferentes, use a visão Média diária.");
  if(st.cmp==="ant" && !cr) msgs.push("Não há período anterior disponível para comparação.");
  var n=document.getElementById("notice"); n.hidden=!msgs.length; document.getElementById("noticeTxt").textContent=msgs.join(" ");
}

function render(){ renderNotice(); renderKpis(); renderEvo(); renderMix(); renderTab(); }

document.getElementById("tagAte").textContent=D.meta.dados_ate;
document.getElementById("tagAtu").textContent=D.meta.atualizado_em;
document.getElementById("notas").innerHTML=D.meta.notas.map(function(n){ return "<li>"+n+"</li>"; }).join("");
initFilters(); render();
var rt; window.addEventListener("resize",function(){ clearTimeout(rt); rt=setTimeout(function(){ renderEvo(); renderMix(); },120); });
})();
</script>
